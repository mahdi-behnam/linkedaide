name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint, Type Check & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: |
          uv python install ${{ matrix.python-version }}
          uv python pin ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Ruff Lint Check
        run: uv run ruff check .

      - name: Ruff Formatting Check
        run: uv run ruff format --check .

      - name: Mypy Static Type Analysis
        run: uv run mypy src tests scripts

      - name: Run Test Suite with Coverage
        run: uv run pytest --cov=agent --cov-report=term-missing --cov-report=xml

  worker-check:
    name: Cloudflare Worker (Type Check & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/telegram-relay-worker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/telegram-relay-worker/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run Tests
        run: npm test

  desktop-check:
    name: Desktop App (Type Check, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Build Desktop Frontend
        run: npm run build

      - name: Build Desktop Electron Bundle
        run: npm run build:electron
