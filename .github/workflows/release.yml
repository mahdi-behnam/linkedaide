name: Release & Package Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force desktop package build regardless of release-please output"
        type: boolean
        default: false
      tag_name:
        description: "Tag name to package (e.g. v1.0.0, required if force_build is true)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please (PR / Tag / Release)
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-desktop:
    name: Build & Package Desktop (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || inputs.force_build == true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to Release Tag If Available
        run: |
          TARGET_TAG="${{ needs.release-please.outputs.tag_name || inputs.tag_name }}"
          if [ -n "$TARGET_TAG" ] && git rev-parse -q --verify "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "Checking out tag: $TARGET_TAG"
            git checkout "$TARGET_TAG"
          else
            echo "Tag '$TARGET_TAG' not found in repository. Continuing on current commit ($(git rev-parse --short HEAD))."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "desktop/package-lock.json"

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Build & Package Desktop
        working-directory: desktop
        run: npm run package

      - name: Package Installers & Publish to GitHub Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --publish always -c.publish.releaseType=release

      - name: Compute Checksums
        run: |
          mkdir -p checksums
          cd desktop/release
          for f in LinkedAide*.*; do
            if [ -f "$f" ] && [[ "$f" != *.blockmap ]] && [[ "$f" != *.yml ]] && [[ "$f" != *.yaml ]] && [[ "$f" != *.sha256 ]]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" >> ../../checksums/checksums-${{ matrix.os }}.txt
              else
                shasum -a 256 "$f" >> ../../checksums/checksums-${{ matrix.os }}.txt
              fi
            fi
          done

      - name: Upload Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.os }}
          path: checksums/checksums-${{ matrix.os }}.txt
          retention-days: 1

  publish-checksums:
    name: Aggregate & Publish SHA-256 Checksums
    needs: [release-please, build-desktop]
    if: always() && (needs.release-please.outputs.releases_created == 'true' || inputs.force_build == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Checksum Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true
          path: all-checksums

      - name: Generate SHA256SUMS.txt
        run: |
          cd all-checksums
          cat checksums-*.txt | sort -u > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Attach SHA256SUMS.txt to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
        run: |
          if [ -n "$TAG_NAME" ]; then
            gh release upload "$TAG_NAME" SHA256SUMS.txt --clobber
          else
            echo "No tag name resolved; skipping release asset upload."
          fi

      - name: Publish GitHub Release as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
        run: |
          RESOLVED_TAG="$TAG_NAME"
          if [ -z "$RESOLVED_TAG" ]; then
            RESOLVED_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          if [ -n "$RESOLVED_TAG" ]; then
            echo "Publishing and setting release as latest for tag: $RESOLVED_TAG"
            gh release edit "$RESOLVED_TAG" --draft=false --latest
          else
            echo "No tag could be resolved to mark as latest."
          fi
