name: LinkedIn Post Ideation

on:
  schedule:
    # Runs daily at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run Mode (No real Telegram suggestion delivery)"
        required: false
        type: boolean
        default: false

concurrency:
  group: linkedin-agent-single-flight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ideate:
    name: Draft Post Ideas
    if: ${{ vars.AGENT_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Execute Ideation Flow
        env:
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NIM_MODEL_PRIMARY: ${{ vars.NIM_MODEL_PRIMARY }}
          NIM_MODEL_FALLBACK: ${{ vars.NIM_MODEL_FALLBACK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_AUTHORIZED_CHAT_ID: ${{ secrets.TELEGRAM_AUTHORIZED_CHAT_ID }}
          USER_FOCUS_AREAS: ${{ vars.USER_FOCUS_AREAS }}
          USER_PERSONA: ${{ vars.USER_PERSONA || '' }}
          MAX_SUGGESTIONS_PER_RUN: ${{ vars.MAX_SUGGESTIONS_PER_RUN }}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || false }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID || vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND || 'kv' }}
        run: uv run python -m agent.orchestration.ideation_flow
