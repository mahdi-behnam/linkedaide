name: LinkedIn Session Health Check

on:
  schedule:
    # Runs weekly every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: linkedin-agent-single-flight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  health_check:
    name: Canary Session Health Check
    if: ${{ vars.AGENT_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Decrypt Storage State
        env:
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          LINKEDIN_SESSION_STATE_ENC: ${{ secrets.LINKEDIN_SESSION_STATE_ENC }}
        run: uv run python -m agent.browser.session decrypt --out "/tmp/runner_storage_state.json"

      - name: Execute Health Check Flow
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_AUTHORIZED_CHAT_ID: ${{ secrets.TELEGRAM_AUTHORIZED_CHAT_ID }}
          LINKEDIN_STORAGE_STATE_PATH: /tmp/runner_storage_state.json
        run: uv run python -m agent.orchestration.health_check_flow

      - name: Wipe Decrypted Storage State
        if: always()
        run: rm -f /tmp/runner_storage_state.json

      - name: Commit and Push Breaker Incident State If Tripped
        if: always()
        run: |
          git config user.name "linkedin-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/incident.json || true
          git diff --staged --quiet || (git commit -m "chore(safety): record circuit breaker incident state [skip ci]" && git push)
