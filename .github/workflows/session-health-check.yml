name: Session Health Check

on:
  schedule:
    # Runs weekly every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: linkedin-browser-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  health_check:
    name: Canary Session Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Decrypt Storage State
        env:
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          LINKEDIN_SESSION_STATE_ENC: ${{ secrets.LINKEDIN_SESSION_STATE_ENC }}
        run: |
          uv run python -c "
          import os
          from pathlib import Path
          from pydantic import SecretStr
          from agent.browser.session import decrypt_storage_state

          key = SecretStr(os.environ['SESSION_ENCRYPTION_KEY'])
          enc = os.environ['LINKEDIN_SESSION_STATE_ENC']
          out = Path('/tmp/runner_storage_state.json')
          decrypt_storage_state(enc, key, out)
          "

      - name: Execute Health Check Flow
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_AUTHORIZED_CHAT_ID: ${{ secrets.TELEGRAM_AUTHORIZED_CHAT_ID }}
          LINKEDIN_STORAGE_STATE_PATH: /tmp/runner_storage_state.json
        run: uv run python -m agent.orchestration.health_check_flow

      - name: Wipe Decrypted Storage State
        if: always()
        run: rm -f /tmp/runner_storage_state.json

      - name: Commit and Push Breaker Incident State If Tripped
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/incident.json || true
          git diff --staged --quiet || (git commit -m "chore(safety): record circuit breaker incident state [skip ci]" && git push)
