name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-pattern: desktop/release/*.exe
          - os: macos-latest
            artifact-pattern: desktop/release/*.dmg
          - os: ubuntu-latest
            artifact-pattern: desktop/release/*.AppImage

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "desktop/package-lock.json"

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Build & Package Desktop
        working-directory: desktop
        run: npm run package

      - name: Package Installers & Publish to GitHub Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.draft }}" = "true" ]; then
            npx electron-builder --publish always -c.publish.provider=github -c.publish.releaseType=draft
          else
            npx electron-builder --publish always
          fi
