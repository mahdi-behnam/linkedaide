name: LinkedIn Thread Monitor

on:
  schedule:
    # Runs Monday to Friday at 10:30, 15:30, 20:30 UTC (offset from scout flow)
    - cron: "30 10,15,20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run Mode (No real Telegram writes or durable pending state mutation)"
        required: false
        type: boolean
        default: false

concurrency:
  group: linkedin-agent-single-flight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    name: Inspect Threads & Queue Replies
    if: ${{ vars.AGENT_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Decrypt Storage State
        env:
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          LINKEDIN_SESSION_STATE_ENC: ${{ secrets.LINKEDIN_SESSION_STATE_ENC }}
        run: uv run python -m agent.browser.session decrypt --out "/tmp/runner_storage_state.json"

      - name: Execute Thread Monitor Flow
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NIM_MODEL_PRIMARY: ${{ vars.NIM_MODEL_PRIMARY || 'nvidia/nemotron-3-super-120b-a12b' }}
          NIM_MODEL_FALLBACK: ${{ vars.NIM_MODEL_FALLBACK || 'openai/gpt-oss-20b' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_AUTHORIZED_CHAT_ID: ${{ secrets.TELEGRAM_AUTHORIZED_CHAT_ID }}
          LINKEDIN_STORAGE_STATE_PATH: /tmp/runner_storage_state.json
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || false }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID || vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND || 'kv' }}
          WORKER_URL: ${{ vars.WORKER_URL || secrets.WORKER_URL }}
          DESKTOP_API_SECRET: ${{ secrets.DESKTOP_API_SECRET }}
        run: uv run python -m agent.orchestration.thread_monitor_flow

      - name: Wipe Decrypted Storage State
        if: always()
        run: rm -f /tmp/runner_storage_state.json

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thread-monitor-debug-${{ github.run_id }}
          path: |
            debug/screenshots/**
            debug/traces/**
          retention-days: 7
