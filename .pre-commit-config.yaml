# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # Run the linter with autofix
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: mypy
        name: mypy static type analysis
        entry: uv run mypy src tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-unit
        name: pytest fast unit verification
        entry: uv run pytest tests/unit/test_cli.py tests/unit/test_config.py tests/unit/test_schemas.py
        language: system
        stages: [pre-push]
        pass_filenames: false
