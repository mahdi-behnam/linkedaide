name = "linkedin-agent-telegram-relay"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# Environment secrets required in Cloudflare Worker dashboard:
# - TELEGRAM_WEBHOOK_SECRET
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_AUTHORIZED_CHAT_ID
# - GITHUB_DISPATCH_PAT
# - GITHUB_REPO_OWNER
# - GITHUB_REPO_NAME
# - DESKTOP_API_SECRET
# - NVIDIA_NIM_API_KEY
# - LLM_BASE_URL

# Workers KV Namespace binding for state persistence:
# Create with: npx wrangler kv namespace create LINKEDIN_AGENT_KV
# Then replace "linkedin_agent_kv_namespace" below with your generated 32-character ID:
[[kv_namespaces]]
binding = "LINKEDIN_AGENT_KV"
id = "linkedin_agent_kv_namespace"

# R2 Bucket binding for media vault and execution audit screenshots:
# (Activate R2 once in Cloudflare Dashboard: dash.cloudflare.com -> R2 -> Enable R2, then run: npx wrangler r2 bucket create linkedin-agent-media)
# (Optional: If not using R2, you can comment out the [[r2_buckets]] block below)
[[r2_buckets]]
binding = "SCREENSHOTS_BUCKET"
bucket_name = "linkedin-agent-media"

