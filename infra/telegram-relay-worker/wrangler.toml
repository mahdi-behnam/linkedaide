name = "linkedin-agent-telegram-relay"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# Environment secrets required in Cloudflare Worker dashboard:
# - TELEGRAM_WEBHOOK_SECRET
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_AUTHORIZED_CHAT_ID
# - GITHUB_DISPATCH_PAT
# - GITHUB_REPO_OWNER
# - GITHUB_REPO_NAME
# - DESKTOP_API_SECRET
# - NVIDIA_NIM_API_KEY
# - LLM_BASE_URL

# Workers KV Namespace binding for state persistence:
# Create with: npx wrangler kv namespace create LINKEDIN_AGENT_KV
# Then replace "linkedin_agent_kv_namespace" below with your generated 32-character ID:
[[kv_namespaces]]
binding = "LINKEDIN_AGENT_KV"
id = "linkedin_agent_kv_namespace"

# R2 Bucket binding for media vault and execution audit screenshots (OPTIONAL):
# NOTE: Cloudflare requires adding a credit card to activate R2 (even though it has a free tier).
# - If you DON'T want R2 / don't want to add a card: Leave the lines below commented out.
#   Execution audit screenshots will automatically be saved locally on disk.
# - If you DO want Cloudflare R2:
#   1. Enable R2 in Cloudflare Dashboard: dash.cloudflare.com -> R2 -> Enable R2
#   2. Run: npx wrangler r2 bucket create linkedin-agent-media
#   3. Uncomment the block below:
# [[r2_buckets]]
# binding = "SCREENSHOTS_BUCKET"
# bucket_name = "linkedin-agent-media"

# Cron triggers for edge scheduler (runs every 15 minutes to check due scheduled posts)
[triggers]
crons = ["*/15 * * * *"]


